<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 550" role="img" aria-labelledby="title desc">
<title id="title">原始300件固定布局覆盖与局部已证最优区域</title>
<desc id="desc">横轴顶部余隙0到12厘米，纵轴承压上限到550千克每平方米。一大车布局在余隙不超过10且承压至少2540/7时已证1辆700元最优；两小车在余隙不超过5且承压至少2220/7时给2辆900元上界。其他区域未被保存池覆盖，不表示无解。</desc>
<rect width="860" height="550" fill="#ffffff"/>
<g font-family="Microsoft YaHei, sans-serif" fill="#223747">
<text x="30" y="36" font-size="21" font-weight="bold">原始300件：固定布局覆盖与局部最优区域</text>
<text x="30" y="63" font-size="13">α ∈ [0,1]；固定原目录、L4、姿态与传力规则。仅展示 p–δ 切片。</text>
<rect x="100" y="100" width="600" height="330" fill="#f1f3f6" stroke="#becbd3"/>
<rect x="100" y="100" width="250" height="139.71" fill="#f9ebc6"/>
<rect x="100" y="100" width="500" height="112.29" fill="#cce9e3"/>
<g stroke="#b7c7d0" stroke-width="1" stroke-dasharray="5 4">
<path d="M100 239.71H700M100 212.29H700M350 100V430M600 100V430" fill="none"/>
</g>
<g stroke="#334f60" stroke-width="1.5"><path d="M100 92V430H715" fill="none"/></g>
<g font-size="12" text-anchor="end">
<text x="89" y="434">0</text><text x="89" y="105">550</text>
<text x="89" y="210">2540/7</text><text x="89" y="247">2220/7</text>
</g>
<g font-size="13" text-anchor="middle"><text x="100" y="452">0</text><text x="350" y="452">5</text><text x="600" y="452">10</text><text x="700" y="452">12</text></g>
<text x="425" y="477" font-size="14" text-anchor="middle">顶部余隙 δ / cm（越大越严格）</text>
<text x="31" y="281" font-size="14" text-anchor="middle" transform="rotate(-90 31 281)">承压上限 p / kg·m⁻²（越小越严格）</text>
<text x="350" y="143" text-anchor="middle" font-size="18" font-weight="bold">已证最优：1辆 / 700元</text>
<text x="350" y="173" text-anchor="middle" font-size="13">一大车见证 + 分别独立的车辆数、费用下界</text>
<text x="425" y="335" text-anchor="middle" font-size="17">保存布局未覆盖：一般可行性与最优值未定</text>
<text x="425" y="362" text-anchor="middle" font-size="13">不能据搜索失败或池中无见证，推断原问题无解</text>
<path d="M260 226L430 272H660" stroke="#92702d" stroke-width="1.3" fill="none"/>
<circle cx="260" cy="226" r="3" fill="#92702d"/>
<text x="440" y="263" font-size="13" fill="#74591d">黄色窄带：两小车2辆/900元可行上界</text>
<rect x="100" y="500" width="15" height="15" fill="#cce9e3"/><text x="124" y="513" font-size="12">原问题局部已证最优</text>
<rect x="300" y="500" width="15" height="15" fill="#f9ebc6"/><text x="324" y="513" font-size="12">仅保存布局的可行上界</text>
<rect x="530" y="500" width="15" height="15" fill="#f1f3f6" stroke="#becbd3"/><text x="554" y="513" font-size="12">未覆盖，不是已证无解</text>
<text x="100" y="537" font-size="11" fill="#607481">阈值取等可行；绿色区包含黄色布局也可行的重叠部分。p可继续向上延伸，此图只画到550。</text>
</g></svg>
